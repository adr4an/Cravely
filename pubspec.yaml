name: cravely
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI and Utility Packages
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.6.0
  google_fonts: ^8.0.2
  flex_color_scheme: ^8.4.0
  remixicon: ^4.9.1
  alert_banner: ^1.0.1
  flutter_svg: ^2.2.4

  # Image Caching and Loading Effects
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Dependency Injection
  get_it: ^9.2.1
    
  # Firebase Dependencies
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  rxdart: ^0.28.0

  # Social Sign-In
  google_sign_in: ^7.2.0
  # sign_in_with_apple: ^4.0.0

  # State Management
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1

  # Location of philippines cities and provinces
  philippines_rpcmb: ^0.0.3

  # For app icons and splash screens
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  # for checking internet connection
  connectivity_plus: ^4.0.2

  # fancy printing 
  logger: ^2.2.0
  lottie: ^3.3.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # generate code for Hive type adapters
  # dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/pizzas/
    - assets/splash/
    - assets/logo/
    - assets/icon/
    - assets/svg/
